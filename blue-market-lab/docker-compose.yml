services:
  web:
    build: ./app
    volumes:
      - ./app:/var/www/html
    environment:
      APP_MODE: ${APP_MODE:-vulnerable}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: bluemarket
      APP_DB_USER: app_user
      APP_DB_PASS: app_user_password
      REPORT_DB_USER: report_user
      REPORT_DB_PASS: report_user_password
      EXT_DB_USER: extension_user
      EXT_DB_PASS: extension_user_password
    depends_on:
      - postgres

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${WEB_PORT:-5000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public:/var/www/html/public:ro
    depends_on:
      - web

  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluemarket
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
